services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./seed-data:/app/seed-data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.compose
    ports:
      - "5173:80"
    depends_on:
      - backend

  evals:
    profiles: ["evals"]
    build:
      context: .
      dockerfile: evals/Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      EVALS_RESULTS_DIR: /app/evals/results
    volumes:
      - ./data:/app/data
      - ./evals/results:/app/evals/results
